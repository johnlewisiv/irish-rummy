services:
  - type: web
    name: irish-rummy
    env: node
    plan: starter
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: node server/src/index.js
    # Keep deployment manual until the preserved legacy snapshot is imported.
    autoDeploy: false
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: game-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NODE_VERSION
        value: 22
      - key: ROOM_STATE_FILE
        value: /var/data/irish-rummy-state.json
      # Set the new project's connection URL in Render's secret environment UI
      # only after importing the preserved disk snapshot during maintenance.
      - key: IRISH_RUMMY_DATABASE_URL
        sync: false
      - key: IRISH_RUMMY_STATE_KEY
        value: family-games
      - key: IRISH_RUMMY_DATABASE_CA_FILE
        value: server/certs/supabase-prod-ca-2021.crt
